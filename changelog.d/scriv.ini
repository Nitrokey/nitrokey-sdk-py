[scriv]
categories =
compact_fragments = true
entry_title_template = [v{{ version }}](https://github.com/Nitrokey/nitrokey-sdk-py/releases/tag/v{{ version }}) ({{ date.strftime('%%Y-%%m-%%d') }})
format = md
md_header_level = 2
md_html_anchors = false
new_fragment_template = -
version = literal: pyproject.toml: project.version
